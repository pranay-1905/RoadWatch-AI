<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rw-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Branded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#rw-gradient)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" filter="url(#glow)" />

  <!-- RoadWatch AI Telemetry Beacon & Radar Symbol (Lucide Radio) -->
  <g transform="translate(14, 14) scale(1.5)" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Central Node -->
    <circle cx="12" cy="12" r="2.2" fill="#ffffff" stroke="none" />
    
    <!-- Inner Telemetry Waves -->
    <path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49" />
    
    <!-- Outer Telemetry Waves -->
    <path d="M19.07 4.93a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14" />
  </g>
</svg>
